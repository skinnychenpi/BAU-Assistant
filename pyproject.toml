[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "bau-assistant"
version = "0.1.0"
description = "AI Agent for automating Data Engineering BAU workflows"
requires-python = ">=3.11"

dependencies = [
    # LLM
    "anthropic>=0.25.0",
    # Gmail
    "google-auth>=2.29.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.125.0",
    # GitLab
    "python-gitlab>=4.4.0",
    # HTTP
    "httpx>=0.27.0",
    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",
    # Config
    "pydantic-settings>=2.2.0",
    # Utils
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[project.scripts]
bau = "bau.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
